<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Kahoot</title>

    <link rel="stylesheet" href="clase-mates.css">
    <script src="clase-mates.js" defer></script>
</head>

<body> 

    <header class="header">

        <div class="brand">
            <div class="brand__logo">L</div>
            <span class="brand__name">LinkRoom</span>
        </div>

        <nav class="nav" aria-label="Navegación principal">
            <ul class="nav__list">
                <li>
                    <a href="#" class="nav__link">Inicio</a>
                </li>

                <li>
                    <a href="#" class="nav__link">Funciones</a>
                </li>

                <li>
                    <a href="#" class="nav__link">Cursos</a>
                </li>

                <li>
                    <a href="#" class="nav__link">Contacto</a>
                </li>
            </ul>
        </nav>

        <div class="header__actions">
            <a href="#" class="login">Iniciar sesión</a>
            <a href="#" class="register">Crear cuenta</a>
        </div>

    </header>


    <main class="main">

        <section class="intro">

            <h1 class="intro__title">
                Pon a prueba tus
                <span>conocimientos</span>
            </h1>

            <p class="intro__description">
                Quiz de matemática básica para aprender jugando.
            </p>

        </section>


        <article class="quiz-card">

            <section id="quiz">

                <header class="quiz-header">

                    <p class="question-counter">
                        Pregunta
                        <span id="current-question">1</span>
                        de
                        <span id="total-questions">10</span>
                    </p>

                    <p class="score">
                        Puntos:
                        <span id="score">0</span>
                    </p>

                </header>


                <div class="progress-container">

                    <div
                        class="progress-bar"
                        id="progress-bar">
                    </div>

                </div>


                <section class="question-section">

                    <h2
                        class="question"
                        id="question">
                    </h2>

                </section>


                <form id="quiz-form">

                    <fieldset class="answers-fieldset">

                        <legend>
                            Seleccioná una respuesta
                        </legend>

                        <div
                            class="answers"
                            id="answers">
                        </div>

                    </fieldset>

                </form>


                <p
                    class="feedback"
                    id="feedback"
                    aria-live="polite">
                </p>


                <div class="actions">

                    <button
                        type="button"
                        class="button button--next"
                        id="next-button">

                        Siguiente →

                    </button>

                </div>

            </section>


            <section
                class="result"
                id="result"
                aria-live="polite">

                <div class="result__icon">
                    ✓
                </div>

                <h2 class="result__title">
                    ¡Quiz terminado!
                </h2>

                <p class="result__description">
                    Tu puntuación final es:
                </p>

                <output
                    class="result__score"
                    id="final-score">
                    0/10
                </output>

                <p
                    class="result__message"
                    id="result-message">
                </p>

                <div class="actions">

                    <button
                        type="button"
                        class="button"
                        id="restart-button">

                        Intentar nuevamente

                    </button>

                </div>

            </section>

        </article>

    </main>
</body>

</html>
