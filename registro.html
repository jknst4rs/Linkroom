<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkRoom | Crear cuenta</title>
    <link rel="stylesheet" href="linkroom.css">
    <script src="Linkroom.js" defer></script>
</head>

<body>
    <header class="encabezado">
        <div class="logo">
            <span>LinkRoom</span>
        </div>

        <div class="botones-encabezado">
            <a href="index.html" class="login-btn">Volver al inicio</a>
            <a href="registro.html" class="boton-principal">Iniciar sesión</a>
        </div>
    </header>

    <main>
        <section class="formulario-seccion">

            <h1 id="colorButton">Iniciar sesion</h1>
            <p>Únete a LinkRoom y comienza a aprender.</p>

            <form>

                <label for="correo">Correo electrónico</label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required
                >

                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <button type="submit" class="boton-principal">
                    inicia sesion
                </button>
            </form>

            <p>
                ¿No tienes una cuenta?
                <a href="crear-cuenta.html">Unete a linkroom</a>
            </p>
           
        </section>
    </main>

</body>
</html>
